# Local development stack with Postgres
# Uso: docker compose -f docker-compose.local.yml up -d

name: parcial1-sw2-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: cine_local_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cine_ia
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./base_datos_cine_ia_completa.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cine_ia"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: cine_local_backend
    env_file:
      - ./Backend/.env.local
    environment:
      PORT: 3333
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cine_ia
      DB_SSL: 'false'
    ports:
      - '3333:3333'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Parcial1_Sw2_Frontend
      dockerfile: Dockerfile
    container_name: cine_local_frontend
    environment:
      VITE_API_URL: http://localhost:3333/api
      VITE_VOICE_API_URL: http://localhost:8001
      VITE_GOOGLE_CLIENT_ID: 12414827958-jim0qgmma2n35cu2jouo165k9aahfk7n.apps.googleusercontent.com
      VITE_CLOUDINARY_CLOUD_NAME: mmhgfdav
      VITE_CLOUDINARY_UPLOAD_PRESET: ml_default
    ports:
      - '3000:3000'
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
