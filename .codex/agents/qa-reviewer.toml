## Modo SYSTEM — levantar y verificar el sistema completo

Se activa cuando todo el sprint está aprobado y hay que verificar que el sistema funciona de punta a punta, incluyendo el comportamiento en los 3 perfiles de despliegue de RF15.

### 1. Levantar servicios

```bash
docker-compose up -d db   # Postgres local (o apuntar a Supabase de test)

cd backend && npm run start:dev &
cd ai-service && uvicorn app.main:app --reload --port 8001 &
cd web-admin && npm run dev &
```

### 2. Health checks

```bash
curl -s http://localhost:3000/api/health | jq .status
curl -s http://localhost:8001/health | jq .
curl -s -o /dev/null -w "%{http_code}" http://localhost:5173
```

### 3. Smoke test end-to-end — flujo de cliente (CU02)

```bash
# 1. Interpretar la compra por texto (simulando STT ya resuelto)
curl -s -X POST http://localhost:8001/nlu/interpretar \
  -H "Content-Type: application/json" \
  -d '{"texto":"quiero 2 entradas para Batman a las 8","sesion":"qa-e2e-1","rol":"cliente"}' | jq .

# 2. Confirmar (segundo turno) — el ai-service debe recién ahora llamar al gateway
curl -s -X POST http://localhost:8001/nlu/interpretar \
  -H "Content-Type: application/json" \
  -d '{"texto":"sí, confirmo","sesion":"qa-e2e-1","rol":"cliente"}' | jq .

# 3. Verificar que la venta quedó registrada en el backend con los flags correctos
curl -s -H "Authorization: Bearer $TOKEN" \
  "http://localhost:3000/api/ventas?funcion=1" | jq '.[] | {id_venta, confirmacion_no_reembolso, confirmacion_verbal_check}'
```

### 4. Smoke test end-to-end — flujo de admin (CU04, RF09/RF10)

```bash
# 1. Instrucción ambigua a propósito
curl -s -X POST http://localhost:8001/nlu/interpretar \
  -H "Content-Type: application/json" \
  -d '{"texto":"cambia el horario de la función","sesion":"qa-e2e-2","rol":"administrador"}' | jq .
# Esperado: el sistema pide aclaración (qué función, qué horario), NO ejecuta nada.

# 2. Verificar que sin confirmación no se tocó la base
curl -s -H "Authorization: Bearer $TOKEN" http://localhost:3000/api/funciones/1 | jq .hora_inicio
# El valor debe seguir siendo el original.

# 3. Verificar que la acción, una vez confirmada, sí se refleja en log_acciones
curl -s -H "Authorization: Bearer $TOKEN" http://localhost:3000/api/audit/log-acciones | jq '.[0]'
```

### 5. Prueba de degradación por perfil (RF15/RF17)

```bash
# Perfil "móvil ligero" simulado con recursos acotados
docker run --cpus=1 --memory=512m ai-service:mobile-profile
# Verificás: el flujo de compra se completa igual (aunque la respuesta hablada sea más simple),
# y que ningún paso de confirmación se saltea por estar en el perfil limitado.
```

### 6. Prueba de errores esperados

- [ ] Request sin token → 401.
- [ ] Rol incorrecto para el endpoint → 403.
- [ ] Recurso inexistente → 404 con mensaje claro.
- [ ] Payload inválido → 400/422 con detalle del campo.
- [ ] Solapamiento de horario → 409.
- [ ] Venta sin confirmación → 422, nunca se crea.
- [ ] Acción de voz ambigua → pregunta de aclaración, nunca una ejecución al azar.

**Output modo SYSTEM:**
```
SISTEMA: Sprint [N]
✓/✗ Backend NestJS en :3000
✓/✗ AI-service en :8001
✓/✗ Web-admin en :5173
✓/✗ Smoke test CU02 (compra por voz) completado
✓/✗ Smoke test CU04 (gestión por voz, con aclaración) completado
✓/✗ Aislamiento por rol (RF11) verificado
✓/✗ Confirmación obligatoria (RF03/RF19) verificada — nada se ejecuta sin confirmar
✓/✗ Ejecución real, no simulada (RF10) verificada — log_acciones refleja la acción
✓/✗ Degradación en perfil móvil (RF15/RF17) probada con recursos acotados
✓/✗ Pruebas de error esperadas OK

ESTADO FINAL: SISTEMA LISTO / SISTEMA CON FALLOS
PRÓXIMO SPRINT: [puede comenzar / espera correcciones]
```

