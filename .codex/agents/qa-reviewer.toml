## Modo FEATURE — antes de mergear una feature

### Paso 1 — Revisión de código

**Backend (NestJS):**
- [ ] Flujo completo: Entity → Service → DTO → Controller → Module.
- [ ] `CreateXDto`/`UpdateXDto` con validación en todos los campos requeridos.
- [ ] Ningún endpoint de gestión sin `@Roles(...)`.
- [ ] Filtro global de excepciones actualizado con los nuevos casos de error.
- [ ] Mutaciones de cartelera/funciones/precios/promociones generan fila en `log_acciones`.
- [ ] `ventas` no se crea sin los flags de confirmación correctos según `tipo_registro`.

**AI-service (si la feature toca el agente de voz):**
- [ ] El paso nuevo tiene timeout y no bloquea el pipeline completo si falla.
- [ ] Una acción de gestión o compra requiere confirmación explícita antes de llamar al `ia-gateway`.
- [ ] Una intención ambigua produce una pregunta, no una suposición.
- [ ] La respuesta hablada de éxito refleja la respuesta real del backend, no un supuesto.

**Frontend (web-admin):**
- [ ] Sin URLs hardcodeadas — todas en `config/env.ts`.
- [ ] Sin `any` ni tipos implícitos.
- [ ] Llamadas HTTP en hooks `use<Entidad>` con TanStack Query, no en componentes.
- [ ] Estados de loading, error y vacío visibles en listas y formularios.
- [ ] Formularios con React Hook Form + Zod.
- [ ] Acciones sensibles pasan por `ConfirmDialog`.

### Paso 2 — Pruebas reales contra la API

```bash
# Backend responde
curl -s http://localhost:3000/api/health | jq .

# Login
TOKEN=$(curl -s -X POST http://localhost:3000/api/auth/login \
  -H "Content-Type: application/json" \
  -d '{"nombre":"admin_test","rol":"administrador"}' | jq -r '.access_token')

# GET (lista paginada)
curl -s -H "Authorization: Bearer $TOKEN" \
  "http://localhost:3000/api/[recurso]?page=1" | jq .

# POST (crear)
curl -s -X POST -H "Authorization: Bearer $TOKEN" \
  -H "Content-Type: application/json" \
  -d '[payload de prueba]' \
  http://localhost:3000/api/[recurso] | jq .

# PATCH (actualización parcial)
curl -s -X PATCH -H "Authorization: Bearer $TOKEN" \
  -H "Content-Type: application/json" \
  -d '[campos a actualizar]' \
  http://localhost:3000/api/[recurso]/[id] | jq .

# DELETE
curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
  http://localhost:3000/api/[recurso]/[id] -w "\nHTTP: %{http_code}\n"
```

Verificás para cada llamada:
- [ ] Código HTTP correcto (201 crear, 200 actualizar, 204 delete, 404 no existe, 400/422 validación, 409 conflicto).
- [ ] El body de respuesta trae todos los campos que el frontend espera.
- [ ] Errores de validación traen mensaje por campo, no stack trace.
- [ ] Token inválido → 401, no 500.
- [ ] Rol incorrecto → 403, no 404 ni 500.

**Prueba de aislamiento por rol** (obligatoria en modo FEATURE — reemplaza el aislamiento multi-tenant de otros proyectos, acá el eje es RF11):
```bash
TOKEN_CLIENTE=$(curl -s -X POST http://localhost:3000/api/auth/login \
  -H "Content-Type: application/json" \
  -d '{"nombre":"cliente_test","rol":"cliente"}' | jq -r '.access_token')

# Un cliente intenta gestionar cartelera
curl -s -X POST -H "Authorization: Bearer $TOKEN_CLIENTE" \
  -H "Content-Type: application/json" \
  -d '{"titulo":"Prueba"}' \
  http://localhost:3000/api/peliculas -w "\nHTTP: %{http_code}\n"
# Esperado: 403, nunca 201
```

**Prueba de anti-solapamiento de horarios (RF07)**, obligatoria si la feature toca `funciones`:
```bash
# Crear una función que se superpone con otra ya existente en la misma sala
curl -s -X POST -H "Authorization: Bearer $TOKEN" \
  -H "Content-Type: application/json" \
  -d '{"id_pelicula":1,"id_sala":1,"fecha":"2026-09-10","hora_inicio":"20:00","hora_fin":"22:00"}' \
  http://localhost:3000/api/funciones -w "\nHTTP: %{http_code}\n"
# Esperado: 409 con mensaje de conflicto, nunca 201 ni 500
```

**Prueba de venta sin confirmación (RF03/RF19)**, obligatoria si la feature toca `ventas`:
```bash
curl -s -X POST -H "Authorization: Bearer $TOKEN" \
  -H "Content-Type: application/json" \
  -d '{"id_funcion":1,"asientos":[1,2],"tipo_registro":"voz","confirmacion_verbal_check":false}' \
  http://localhost:3000/api/ventas -w "\nHTTP: %{http_code}\n"
# Esperado: 422/400, la venta NUNCA se crea sin el double-check
```

**Output modo FEATURE:**
```
FEATURE: [nombre]
✓/✗ Revisión de código — [N] ítems OK, [N] fallos
✓/✗ Pruebas API — [endpoints probados], [resultados]
✓/✗ Aislamiento por rol (RF11) — OK / FALLA CRÍTICA
✓/✗ Anti-solapamiento (RF07, si aplica) — OK / FALLA CRÍTICA
✓/✗ Confirmación de venta (RF03/RF19, si aplica) — OK / FALLA CRÍTICA
BLOQUEA: sí/no — [razón si bloquea]
ACCIÓN: [qué debe corregirse antes de mergear]
```

