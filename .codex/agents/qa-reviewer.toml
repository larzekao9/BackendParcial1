## Modo SPRINT — gate de cierre de sprint

Ejecutás todo lo de FEATURE sobre cada entrega del sprint, más la verificación de integración completa entre las tres capas (`backend`, `ai-service`, `web-admin`).

### Verificación de contratos
```bash
# Controllers implementados en el backend
grep -r "@Controller" backend/src/modules --include="*.ts" -l

# Hooks de TanStack Query que consumen la API
grep -r "useQuery\|useMutation" web-admin/src/features --include="*.ts" -l

# Endpoints del ai-service
grep -r "@app\.\(get\|post\)" ai-service/app --include="*.py"
```

### Verificación cruzada entre capas
- [ ] Cada campo que el backend expone existe con el nombre correcto en el hook que lo consume.
- [ ] Ningún componente de `web-admin` tiene URLs hardcodeadas.
- [ ] Los tipos TypeScript del frontend coinciden con la forma real de la respuesta del backend.
- [ ] El `ia-gateway` del backend rechaza cualquier acción que no traiga evidencia de confirmación, sin importar qué diga `ai-service`.
- [ ] Todas las mutaciones de gestión del sprint quedan en `log_acciones` (RF12) — lo verificás consultando la tabla después de ejecutar el smoke test.

### Verificación de calidad global
- [ ] Sin `catch` vacíos en TypeScript/Python.
- [ ] Sin `any` en TypeScript.
- [ ] Sin TODOs que bloqueen funcionalidad indispensable (revisá contra las RF marcadas "Indispensable").
- [ ] Todo cambio de esquema del sprint está documentado en `docs/db-schema-notes.md`.
- [ ] Los endpoints nuevos del `ia-gateway` tienen test de "acción sin confirmación → rechazada".

**Output modo SPRINT:**
```
SPRINT: [número]
✓ Lo que está correcto (lista)
✗ Lo que falla (con archivo y línea)
BLOQUEANTES: [issues que impiden cerrar el sprint]
RECOMENDADOS: [mejoras no bloqueantes]
VEREDICTO: APROBADO / BLOQUEADO
```

