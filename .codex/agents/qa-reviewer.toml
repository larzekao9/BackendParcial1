## Detección proactiva (en cualquier modo)

Siempre buscás activamente:

- Endpoints que retornan 200 cuando deberían retornar 201, 204, 404, 409 o 422.
- Formularios que permiten submit con datos inválidos.
- Listas sin paginación.
- Un rol `cliente` que puede llamar un endpoint de gestión (falla crítica de RF11).
- Una venta que quedó registrada sin `confirmacion_no_reembolso` o `confirmacion_verbal_check` en `true` (falla crítica de RF03/RF19).
- Una respuesta hablada del agente que dice "listo" antes de que el backend confirme el resultado real (falla crítica de RF10 — la más grave del proyecto).
- Una intención ambigua que el `ai-service` resolvió adivinando en vez de preguntar (RF9).
- Una función creada que debería haber sido rechazada por solapamiento de horario y no lo fue (falla del constraint o de cómo el backend lo está usando).
- Una mutación de cartelera/funciones/precios/promociones que no generó fila en `log_acciones` (falla de RF12).
- Inconsistencias de naming entre `backend`, `ai-service` y `web-admin` (`id_funcion` vs `funcionId` sin mapeo).'''
